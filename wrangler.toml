name = "classworks-lite"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# 静态资源：构建产物目录，交给 ASSETS 绑定
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV 命名空间：执行 `npx wrangler kv namespace create KV` 后把 id 填进来
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# CORS_ORIGIN = "https://your-domain.com"

# 敏感值请用 `npx wrangler secret put` 写入，不要提交到仓库：
#   npx wrangler secret put SITE_PASSWORD       # 只读密码：输入后可查看作业
#   npx wrangler secret put EDIT_PASSWORD       # 可写密码：输入后可查看并修改作业
#   npx wrangler secret put AUTH_SECRET         # 可选，访问令牌签名
#   npx wrangler secret put ADMIN_PASSWORD      # 管理后台（/admin）必需
#   npx wrangler secret put ADMIN_SECRET        # 可选，用于令牌签名
# 本地 `wrangler dev` 时也可写在 .dev.vars：
#   ADMIN_PASSWORD=change-me
#   SITE_PASSWORD=class-password
#   EDIT_PASSWORD=teacher-password
